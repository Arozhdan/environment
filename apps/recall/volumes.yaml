# Fixed volumes that point at host folders, so the pod itself has no hostPath and the namespace
# keeps the restricted profile. Each is claimed by name and by nobody else. `type: Directory`:
# the pod does not start when the folder is missing. Retain: deleting a volume never touches
# the folder. No storage is provisioned; the size is only a required field.
# The owner's whole home folder; the pod mounts it read-only and covers the secret folders.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: recall-home
  labels:
    app.kubernetes.io/name: recall
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: recall
    name: recall-home
  hostPath:
    path: /home/develop
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recall-home
  namespace: recall
  labels:
    app.kubernetes.io/name: recall
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: recall-home
  resources:
    requests:
      storage: 1Gi
---
