---
# The Claude Code hook that `recall install claude` copies beside the settings file. Claude Code
# on the host runs it on every prompt, so the pod must not be able to change it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: recall-claude-hook
  labels:
    app.kubernetes.io/name: recall
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: recall
    name: recall-claude-hook
  hostPath:
    path: /home/develop/.recall/claude-hook
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recall-claude-hook
  namespace: recall
  labels:
    app.kubernetes.io/name: recall
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: recall-claude-hook
  resources:
    requests:
      storage: 1Gi
