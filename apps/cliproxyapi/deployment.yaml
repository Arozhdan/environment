apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
  labels:
    app.kubernetes.io/name: cliproxyapi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxyapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cliproxyapi
    spec:
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cliproxyapi
          image: eceasy/cli-proxy-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8317
          volumeMounts:
            - name: data
              mountPath: /root/.cli-proxy-api
            - name: config
              mountPath: /CLIProxyAPI/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cliproxyapi-data
        - name: config
          secret:
            secretName: cliproxyapi-config