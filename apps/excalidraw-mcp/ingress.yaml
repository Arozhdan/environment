apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: excalidraw-mcp
  namespace: excalidraw-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - excalidraw-mcp.tweak.codes
      secretName: excalidraw-mcp-tls
  rules:
    - host: excalidraw-mcp.tweak.codes
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: excalidraw-mcp
                port:
                  number: 80
