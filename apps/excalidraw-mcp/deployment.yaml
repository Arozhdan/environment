apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidraw-mcp
  namespace: excalidraw-mcp
  labels:
    app.kubernetes.io/name: excalidraw-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: excalidraw-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: excalidraw-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: excalidraw-mcp
          image: ghcr.io/arozhdan/excalidraw-mcp@sha256:358cb94d39b5e72889e0c8254f3f6681ac5db638871ac472893f318edc8127d7
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: TMPDIR
              value: /data/tmp
          envFrom:
            - secretRef:
                name: excalidraw-mcp-runtime
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: excalidraw-mcp-data
