# actions-runner-controller v2 — pin chart version in kustomization.yaml.
# Defaults are sane for a small homelab cluster; override only what we need.

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# The controller watches AutoscalingRunnerSet CRs and provisions ephemeral
# runner pods on demand. It does NOT need access to GitHub directly — the
# scale set in `infra/50-arc-runners-opshot` carries the PAT.
flags:
  watchSingleNamespace: ""

# Pin the ServiceAccount name so the scale set chart in
# `infra/50-arc-runners-opshot` can reference it explicitly. Without this
# the SA name is derived from the release name + chart suffix — long and
# fragile across helm/chart versions. The scale set's
# `controllerServiceAccount.name` must match.
serviceAccount:
  create: true
  name: gha-rs-controller
